# The settings of dokimi-go, which ergon init merges into .golangci.yml.

linters:
  settings:
    # A view of a medium, such as the disk of a host, returns the error of the medium as the
    # medium returns it. A caller matches medium.ErrCrashed with errors.Is, and a reader compares
    # io.EOF with ==, so a call into the medium needs no wrap.
    wrapcheck:
      ignore-package-globs:
        - go.dokimi.dev/medium
    gosec:
      excludes:
        # A fault of a double takes its random numbers from a seeded source that the test passes,
        # so a seeded run repeats its faults. A cryptographic source cannot repeat a run.
        - G404

formatters:
  settings:
    # The modules of dokimi-go form an import group of their own.
    gci:
      sections: [standard, default, "prefix(go.dokimi.dev/conform,go.dokimi.dev/fault,go.dokimi.dev/host,go.dokimi.dev/medium,go.dokimi.dev/sim,go.dokimi.dev/spec,go.dokimi.dev/stub)"]
