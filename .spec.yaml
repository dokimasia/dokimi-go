# The copy of the conformance spec of dokimi, which spec sync writes and spec check verifies. The
# package spec of the module spec embeds the copy, and its generator declares the constants with the
# Go spellings of naming.json. Every module of the runtime reads the copy through that package.
implements:
  - definition: dokimasia/dokimi
    track: release
    path: spec
    languages: [go]
    test: [make, test-go]
